name: Publish containers

on:
  # A push publishes only when what the images and the package are built from changes, so a change
  # to the documentation alone publishes nothing.
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - '.github/workflows/publish.yml'
      - '.dockerignore'
      - 'compose*.yml'
      - '.env.example'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'core/**'
      - 'images/**'
      - 'packaging/**'
      - 'deploy/**'
      - 'tests/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  # A pull request runs only the checks and the audit; every publishing job is limited to master and
  # the tags. It runs them for the push's paths and for docs/ and the README, which the tests hold to
  # the routes and tools they describe. tests/test_publish_triggers.py keeps the two lists so.
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/publish.yml'
      - '.dockerignore'
      - 'compose*.yml'
      - '.env.example'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'core/**'
      - 'images/**'
      - 'packaging/**'
      - 'deploy/**'
      - 'tests/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels the run of the older one, which only checks. A publish
# is never cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every image is published to Docker Hub too, under this account with the `DOCKER_HUB_TOKEN`
# secret. Docker Hub has no nested repositories, so a desktop image is `thoric-ubuntu-xfce`
# there. The catalog and the installation files keep naming GHCR.
env:
  DOCKER_HUB_USER: co3moz

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check frontend
        working-directory: core/web
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test
          bun run build
      # Without a name, rustup installs the release rust-toolchain.toml names, with its profile and
      # components, and every cargo command below runs on it.
      - name: Set up Rust
        run: rustup toolchain install
      # The compiled dependencies, keyed by the toolchain and the manifests. Only master saves them,
      # a tag or pull request run reads master's, since the image builds share the repository's
      # cache space.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check Python tests
        run: python3 tests/unit.py
      # Every shell script of the repository, with the ShellCheck release the script names.
      - name: Check shell scripts
        run: bash tests/shellcheck.sh
      - name: Check backend
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # The list of the Dependencies page, made as the manager image's build makes it, so a lockfile,
      # Dockerfile or workflow it cannot read, or a shipped package without a license, fails here.
      - name: Check the dependency list
        run: python3 core/manager/dependencies.py --strict --output "$RUNNER_TEMP/dependencies.json"
      - name: Validate installation manifests
        run: |
          docker compose --env-file .env.example --profile images config --quiet
          docker compose -f compose.ghcr.yml --env-file .env.example --profile https config --quiet
      # The tag names the published images and core/manager/Cargo.toml the version the WSL package
      # installs.
      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(awk -F'"' '/^version = /{ print $2; exit }' core/manager/Cargo.toml)
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match version $version in core/manager/Cargo.toml"
            exit 1
          fi
      # `latest`, and the desktop images' catalog tag `24.04`, name the newest release, so publishing
      # an older tag again leaves them where they are.
      - name: Find whether the tag is the newest release
        id: newest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          echo "The newest release is v$newest."
          if [[ "v$newest" == "$TAG" ]]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          fi

  # The known advisories of the locked crates and interface packages, beside the checks and for pull
  # requests only. A crate fails it with a vulnerability or an unsound advisory (.cargo/audit.toml),
  # a package with any advisory. Update the dependency; an advisory that no release fixes yet and
  # that cannot reach Thoric is ignored with its reason, in .cargo/audit.toml for a crate, and for a
  # package as `--ignore=<GHSA id>` in the `audit` script of core/web/package.json, with the reason
  # in docs/DEVELOPMENT.md.
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # cargo-audit asks cargo for its version to find the crates.io index it looks up yanked crates
    # in. The runner's own toolchain answers, instead of the release rust-toolchain.toml would
    # download first.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The released binary, checked against the action's checksum, never a build from source.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Audit the crates
        run: cargo audit
      # It runs after a failed crate audit too, so one run reports both.
      - name: Audit the interface packages
        if: ${{ !cancelled() }}
        working-directory: core/web
        run: bun run audit

  # The manager downloads the desktop images published with it, so it is published after them and
  # none of its tags names desktop images that are not there yet.
  publish:
    needs: [checks, publish-desktops]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ env.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          hub="docker.io/$DOCKER_HUB_USER/${REPOSITORY#*/}"
          echo "hub=${hub,,}" >> "$GITHUB_OUTPUT"
          # A manager downloads the desktop images published with it: a release those of its version,
          # a master build those of its commit.
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.names.outputs.image }}
            ${{ steps.names.outputs.hub }}
          # `edge` follows master and `latest` the newest release.
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ needs.checks.outputs.newest == 'true' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # The action labels the license GitHub detects, `GPL-3.0`, which drops "or later" and
          # overrides the Dockerfile's label, so each image names its license here.
          labels: |
            org.opencontainers.image.title=Thoric
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: core/manager/Dockerfile
          platforms: linux/amd64
          build-args: THORIC_RELEASE=${{ steps.names.outputs.release }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,scope=manager,mode=max
      - name: Verify the registry manifests
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          HUB: ${{ steps.names.outputs.hub }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$HUB@$DIGEST"
      - name: Published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '### %s\n\n```text\n%s\n```\n' 'Thoric' "$TAGS" >> "$GITHUB_STEP_SUMMARY"

  # Both desktop images build in one job on one builder, so the second takes the `common` stage of
  # images/desktop/Dockerfile from the first and the two publish the same layers for it, which a
  # host then downloads and stores once. Built in separate jobs, each image installed `common` on
  # its own.
  publish-desktops:
    needs: checks
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ env.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "xfce=ghcr.io/${REPOSITORY,,}/ubuntu-xfce" >> "$GITHUB_OUTPUT"
          echo "gnome=ghcr.io/${REPOSITORY,,}/ubuntu-gnome" >> "$GITHUB_OUTPUT"
          hub="docker.io/$DOCKER_HUB_USER/${REPOSITORY#*/}"
          echo "xfce-hub=${hub,,}-ubuntu-xfce" >> "$GITHUB_OUTPUT"
          echo "gnome-hub=${hub,,}-ubuntu-gnome" >> "$GITHUB_OUTPUT"
      - name: XFCE tags and labels
        id: xfce-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.names.outputs.xfce }}
            ${{ steps.names.outputs.xfce-hub }}
          # `edge` follows master. `latest` and the catalog reference's `24.04` name the newest
          # release, which `docker pull` of the reference and a manager built without a release get.
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ needs.checks.outputs.newest == 'true' }}
            type=raw,value=24.04,enable=${{ needs.checks.outputs.newest == 'true' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Ubuntu 24.04 · Lightweight XFCE
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
      # Each build reads the cache of both images, so a scope the cache evicted still finds `common`
      # in the other one and both images keep the same layers for it.
      - name: Build and publish XFCE
        id: xfce
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/desktop
          file: images/desktop/Dockerfile
          target: xfce
          platforms: linux/amd64
          push: true
          tags: ${{ steps.xfce-meta.outputs.tags }}
          labels: ${{ steps.xfce-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=desktop-xfce
            type=gha,scope=desktop-gnome
          cache-to: type=gha,scope=desktop-xfce,mode=max
      - name: Verify the XFCE registry manifests
        env:
          IMAGE: ${{ steps.names.outputs.xfce }}
          HUB: ${{ steps.names.outputs.xfce-hub }}
          DIGEST: ${{ steps.xfce.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$HUB@$DIGEST"
      - name: Published XFCE image
        env:
          TAGS: ${{ steps.xfce-meta.outputs.tags }}
        run: |
          printf '### %s\n\n```text\n%s\n```\n' 'Ubuntu 24.04 · Lightweight XFCE' "$TAGS" >> "$GITHUB_STEP_SUMMARY"
      - name: GNOME tags and labels
        id: gnome-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.names.outputs.gnome }}
            ${{ steps.names.outputs.gnome-hub }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ needs.checks.outputs.newest == 'true' }}
            type=raw,value=24.04,enable=${{ needs.checks.outputs.newest == 'true' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Ubuntu 24.04 · GNOME
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
      - name: Build and publish GNOME
        id: gnome
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/desktop
          file: images/desktop/Dockerfile
          target: gnome
          platforms: linux/amd64
          push: true
          tags: ${{ steps.gnome-meta.outputs.tags }}
          labels: ${{ steps.gnome-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=desktop-gnome
            type=gha,scope=desktop-xfce
          cache-to: type=gha,scope=desktop-gnome,mode=max
      - name: Verify the GNOME registry manifests
        env:
          IMAGE: ${{ steps.names.outputs.gnome }}
          HUB: ${{ steps.names.outputs.gnome-hub }}
          DIGEST: ${{ steps.gnome.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$HUB@$DIGEST"
      - name: Published GNOME image
        env:
          TAGS: ${{ steps.gnome-meta.outputs.tags }}
        run: |
          printf '### %s\n\n```text\n%s\n```\n' 'Ubuntu 24.04 · GNOME' "$TAGS" >> "$GITHUB_STEP_SUMMARY"
      # The steps the two images run alike from their base image on must have left the same layers,
      # otherwise `common` was built twice again and every host stores it twice.
      - name: Check the shared layers
        shell: bash
        env:
          XFCE: ${{ steps.names.outputs.xfce }}@${{ steps.xfce.outputs.digest }}
          GNOME: ${{ steps.names.outputs.gnome }}@${{ steps.gnome.outputs.digest }}
        run: |
          # The build steps and the layer digests of the amd64 image a reference names.
          describe() {
            local manifest
            manifest=$(docker buildx imagetools inspect --raw "$1")
            if jq -e 'has("manifests")' <<< "$manifest" > /dev/null; then
              manifest=$(docker buildx imagetools inspect --raw "${1%@*}@$(jq -r '.manifests[] | select(.platform.architecture == "amd64").digest' <<< "$manifest")")
            fi
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' | jq -c --argjson manifest "$manifest" \
              '{steps: [.history[] | {created_by, empty: (.empty_layer // false)}], layers: [$manifest.layers[].digest]}'
          }
          xfce=$(describe "$XFCE")
          gnome=$(describe "$GNOME")
          result=$(jq -rn --argjson x "$xfce" --argjson y "$gnome" '
            ([$x.steps, $y.steps] | map(length) | min) as $n
            | $x.steps[:(first(range($n) | select($x.steps[.] != $y.steps[.])) // $n)] as $alike
            | ($alike | map(select(.empty | not)) | length) as $shared
            | [range($shared) | select($x.layers[.] != $y.layers[.])] as $differ
            | if ($alike | any(.created_by | startswith("RUN ")) | not) then
                "::error::The images run no build step alike after their base image"
              elif $differ != [] then
                $differ[] | "::error::Layer \(. + 1) of the \($shared) shared ones differs: \($x.layers[.]) in XFCE, \($y.layers[.]) in GNOME"
              else
                "Both images publish the same first \($shared) layers:", $x.layers[:$shared][]
              end')
          echo "$result"
          ! grep -q '^::error::' <<< "$result"

  # The package installs the manager published under its tag, so the release appears only once
  # every image of that tag is published.
  wsl-package:
    needs: [checks, publish, publish-desktops]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the WSL distribution package
        run: packaging/wsl/build.sh dist/thoric.wsl
      # The PowerShell helper goes with it: it installs and starts the package and opens it to other devices.
      - name: Attach the package and the PowerShell helper to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Thoric $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/thoric.wsl packaging/windows/thoric.ps1 --clobber
