name: thoric

# The manager and the HTTPS service keep their logs in at most three files of 10 MB, whatever the
# Docker daemon's default driver; the manager gives desktops the same while the daemon logs
# through json-file.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  manager:
    image: ${MANAGER_IMAGE:-ghcr.io/co3moz/thoric:latest}
    container_name: ${MANAGER_CONTAINER:-thoric-manager}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    labels:
      thoric.manager: "true"
    environment:
      MANAGER_CONTAINER: ${MANAGER_CONTAINER:-thoric-manager}
      AUTH_MODE: ${AUTH_MODE:-password}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # MCP_ENABLED, its name before 0.6.3, still applies while ROOT_MCP_ENABLED is not set, and is
      # passed on so the manager can say to rename it.
      ROOT_MCP_ENABLED: ${ROOT_MCP_ENABLED:-${MCP_ENABLED:-false}}
      MCP_ENABLED: ${MCP_ENABLED:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-token}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      DESKTOP_IMAGE: ${DESKTOP_IMAGE:-ghcr.io/co3moz/thoric/ubuntu-xfce:24.04}
      WSL_GPU: ${WSL_GPU:-true}
      NVIDIA_COMPUTE: ${NVIDIA_COMPUTE:-true}
      DRI_GPU: ${DRI_GPU:-true}
      GPU_ADAPTER: ${GPU_ADAPTER:-}
      AUDIO_ENABLED: ${AUDIO_ENABLED:-true}
      MICROPHONE_ENABLED: ${MICROPHONE_ENABLED:-true}
      INTERNET_ENABLED: ${INTERNET_ENABLED:-true}
      SUDO_ENABLED: ${SUDO_ENABLED:-true}
      GAMEPAD_ENABLED: ${GAMEPAD_ENABLED:-true}
      VPN_ENABLED: ${VPN_ENABLED:-true}
      GPU_DEFAULT: ${GPU_DEFAULT:-true}
      INTERNET_DEFAULT: ${INTERNET_DEFAULT:-true}
      SUDO_DEFAULT: ${SUDO_DEFAULT:-true}
      AUDIO_DEFAULT: ${AUDIO_DEFAULT:-false}
      MICROPHONE_DEFAULT: ${MICROPHONE_DEFAULT:-false}
      GAMEPAD_DEFAULT: ${GAMEPAD_DEFAULT:-false}
      VPN_DEFAULT: ${VPN_DEFAULT:-false}
      IDLE_STOP_DEFAULT: ${IDLE_STOP_DEFAULT:-0}
      DESKTOP_USER_NAMESPACES: ${DESKTOP_USER_NAMESPACES:-true}
      DESKTOP_PIDS_LIMIT: ${DESKTOP_PIDS_LIMIT:-16384}
      DESKTOP_ADDRESS_POOL: ${DESKTOP_ADDRESS_POOL:-}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-1024}
      IMAGE_ARCHIVE_MAX_MB: ${IMAGE_ARCHIVE_MAX_MB:-65536}
      TEMPLATES_URL: ${TEMPLATES_URL:-}
      VOLUME_FILTER: ${VOLUME_FILTER:-}
      PROXY_URL: ${PROXY_URL:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      PROXY_BYPASS: ${PROXY_BYPASS:-}
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      NOTIFY_URL: ${NOTIFY_URL:-}
      NOTIFY_EVENTS: ${NOTIFY_EVENTS:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      # Apart, so the Settings page edits ALLOWED_HOSTS as .env has it; the manager answers both.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      DESKTOP_HOST: ${DESKTOP_HOST:-localhost}
      RUST_LOG: ${RUST_LOG:-thoric=info,tower_http=info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - manager-data:/data
      # The WSL package takes the dashboard's update requests from this folder. Elsewhere it stays
      # empty, and the dashboard only tells of a new release.
      - ./update:/update
    networks:
      - management

  # Desktop profile images are not services: the manager downloads each one
  # the first time a desktop is created from it, and shows the progress.

  https:
    profiles: [https]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    environment:
      DESKTOP_HOST: ${DESKTOP_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - management
    depends_on:
      - manager

networks:
  management:
volumes:
  manager-data:
    name: ${MANAGER_DATA_VOLUME:-thoric-data}
  caddy-data:
  caddy-config:
